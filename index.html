<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arenna Denver Padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Noto+Serif:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF9F3;
    --blue: #454A60;
    --mint: #B7D7C0;
    --green: #718F85;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--blue);
    font-family: 'Red Hat Display', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 56px 28px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo {
    width: 168px;
    height: auto;
    margin-bottom: 40px;
  }

  .eyebrow {
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--blue);
    opacity: 0.6;
    margin: 0 0 12px;
  }

  h1 {
    font-weight: 800;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 36px;
  }

  .card-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    display: block;
    width: 100%;
    padding: 22px 24px;
    background: white;
    border: 1px solid #454A6022;
    border-radius: 16px;
    text-decoration: none;
    text-align: left;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:active {
    transform: scale(0.98);
  }

  .card-title {
    font-weight: 800;
    font-size: 18px;
    color: var(--blue);
    margin: 0 0 4px;
  }

  .card-sub {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-size: 15px;
    color: var(--blue);
    opacity: 0.7;
    margin: 0;
  }

  .card-arrow {
    float: right;
    color: var(--green);
    font-weight: 800;
    font-size: 18px;
  }

  .divider {
    width: 40px;
    height: 2px;
    background: var(--mint);
    margin: 40px 0 20px;
    border-radius: 2px;
  }

  .footer {
    font-size: 12.5px;
    color: var(--blue);
    opacity: 0.55;
    line-height: 1.6;
  }
</style>
</head>
