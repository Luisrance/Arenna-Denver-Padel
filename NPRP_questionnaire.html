<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPRP — Arenna Player Rating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,500&family=Noto+Serif:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF9F3;
    --blue:#454A60;
    --mint:#B7D7C0;
    --green:#718F85;
    --pink:#ECCDBC;
    --orange:#ED7A42;
    --terracotta:#B93700;
    --blue-08:rgba(69,74,96,0.08);
    --blue-14:rgba(69,74,96,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--blue);
    font-family:'Red Hat Display', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:560px;}

  /* header */
  header{display:flex;align-items:center;justify-content:flex-start;margin-bottom:32px;}
  .logo{height:44px;width:auto;display:block;}

  .intro-copy{
    font-size:15px;
    color:var(--green);
    line-height:1.5;
    margin:0 0 28px;
  }
  .field-group{margin-bottom:18px;}
  .field-label{
    display:block;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--green);
    margin-bottom:7px;
  }
  .field-input{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--blue-14);
    background:var(--cream);
    font-family:inherit;
    font-size:15px;
    color:var(--blue);
    outline:none;
    transition:border-color .15s;
  }
  .field-input:focus{border-color:var(--orange);background:#fff;}
  .field-error{
    font-size:13px;
    color:var(--terracotta);
    font-weight:600;
    min-height:18px;
    margin-top:-6px;
    margin-bottom:6px;
  }
  .save-status{
    margin-top:20px;
    font-size:13px;
    font-weight:600;
    color:var(--green);
  }
  .save-status.error{color:var(--terracotta);}

  /* court progress signature element */
  .court{
    position:relative;
    width:100%;
    height:14px;
    border-radius:7px;
    background:var(--blue-08);
    overflow:hidden;
    margin-bottom:6px;
  }
  .court::after{
    content:'';
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:2px;
    background:var(--cream);
    z-index:2;
  }
  .court-fill{
    position:absolute;
    top:0;left:0;bottom:0;
    width:0%;
    background:linear-gradient(90deg, var(--mint), var(--orange));
    border-radius:7px;
    transition:width .5s cubic-bezier(.65,0,.35,1);
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--green);
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    margin-bottom:36px;
  }

  /* card */
  .card{
    background:#fff;
    border-radius:20px;
    padding:40px 32px;
    box-shadow:0 1px 3px var(--blue-08), 0 12px 32px -16px var(--blue-14);
  }
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--orange);
    margin-bottom:10px;
  }
  h1.question{
    font-size:24px;
    font-weight:700;
    line-height:1.3;
    margin:0 0 28px;
    color:var(--blue);
  }

  /* choice options */
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    text-align:left;
    padding:16px 18px;
    border-radius:12px;
    border:1.5px solid var(--blue-14);
    background:var(--cream);
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    color:var(--blue);
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .option:hover{border-color:var(--orange); background:#fff;}
  .option:active{transform:scale(0.99);}
  .option.selected{
    border-color:var(--terracotta);
    background:var(--pink);
    font-weight:700;
  }

  /* slider */
  .slider-wrap{padding:8px 4px 0;}
  .slider-value{
    font-family:'Red Hat Display', sans-serif;
    font-weight:900;
    font-size:56px;
    color:var(--terracotta);
    text-align:center;
    margin-bottom:4px;
    line-height:1;
  }
  .slider-caption{
    text-align:center;
    font-size:13px;
    color:var(--green);
    font-weight:600;
    margin-bottom:28px;
    min-height:18px;
  }
  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    height:6px;
    border-radius:3px;
    background:var(--blue-14);
    outline:none;
    margin-bottom:8px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:28px;height:28px;
    border-radius:50%;
    background:var(--orange);
    border:4px solid #fff;
    box-shadow:0 2px 6px var(--blue-14);
    cursor:pointer;
    margin-top:-11px;
  }
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;}
  input[type=range]::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;
    background:var(--orange);border:4px solid #fff;
    box-shadow:0 2px 6px var(--blue-14);cursor:pointer;
  }
  .scale-ticks{
    display:flex;justify-content:space-between;
    font-size:11px;color:var(--green);font-weight:600;
    padding:0 2px;
  }

  /* nav */
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;}
  .btn-text{
    background:none;border:none;font-family:inherit;
    font-size:14px;font-weight:600;color:var(--green);
    cursor:pointer;padding:8px 4px;
  }
  .btn-text:disabled{opacity:0;pointer-events:none;}
  .btn-primary{
    background:var(--blue);
    color:var(--cream);
    border:none;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    padding:14px 28px;
    border-radius:12px;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .btn-primary:hover{background:#363a4d;}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{background:var(--blue-14);color:var(--green);cursor:not-allowed;}

  /* results */
  .result-card{text-align:center;}
  .result-eyebrow{
    font-family:'Noto Serif', serif;
    font-style:italic;
    font-weight:500;
    font-size:16px;
    color:var(--green);
    margin-bottom:6px;
  }
  .result-number{
    font-size:88px;
    font-weight:900;
    color:var(--terracotta);
    line-height:1;
    margin:4px 0 2px;
  }
  .result-scale{font-size:15px;color:var(--green);font-weight:600;margin-bottom:6px;}
  .result-tier{
    display:inline-block;
    background:var(--mint);
    color:var(--blue);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:7px 16px;
    border-radius:999px;
    margin-bottom:32px;
  }
  table.breakdown{
    width:100%;
    border-collapse:collapse;
    text-align:left;
    margin-bottom:28px;
  }
  table.breakdown th{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--green);
    font-weight:700;
    padding:0 0 10px;
    border-bottom:1.5px solid var(--blue-14);
  }
  table.breakdown td{
    padding:12px 0;
    font-size:14px;
    border-bottom:1px solid var(--blue-08);
  }
  table.breakdown td:last-child, table.breakdown th:last-child{text-align:right;font-weight:700;color:var(--blue);}
  .modifier-row td{color:var(--green);font-style:italic;}
  .retake{
    background:none;
    border:1.5px solid var(--blue);
    color:var(--blue);
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    padding:13px 24px;
    border-radius:12px;
    cursor:pointer;
    width:100%;
  }
  .retake:hover{background:var(--blue);color:var(--cream);}

  footer{
    margin-top:28px;
    text-align:center;
    font-size:12px;
    color:var(--green);
  }

  @media (max-width:480px){
    .card{padding:32px 22px;}
    h1.question{font-size:20px;}
    .result-number{font-size:68px;}
  }
</style>
</head>

  <input type="hidden" name="tier">
  <input type="hidden" name="q1">
  <input type="hidden" name="q2">
  <input type="hidden" name="q3">
  <input type="hidden" name="q4">
  <input type="hidden" name="q5">
  <input type="hidden" name="q6">
  <input type="hidden" name="q7">
</form>

<script>
const questions = [
  {
    key:'q1', label:'Level', type:'choice', section:'About you',
    text:'What is your level?',
    options:['First Timer of Padel','Beginner','Intermediate','Advanced','Competition']
  },
  {
    key:'q2', label:'Gender', type:'choice', section:'About you', modifier:true,
    text:'Are you male or female?',
    options:['Male','Female']
  },
  {
    key:'q3', label:'Age', type:'choice', section:'About you', modifier:true,
    text:'How old are you?',
    options:['18–30','30–40','40–50','+50']
  },
  {
    key:'q4', label:'Match frequency', type:'choice', section:'On-court history',
    text:'How many padel matches have you played, on average, per week in the last 6 months?',
    options:['I have never played','Less than one per week','1 per week','2 per week','3 or more per week']
  },
  {
    key:'q5', label:'Bandeja', type:'choice', section:'Skill assessment',
    text:'How would you rate your bandeja?',
    options:['What is a bandeja?','Needs development','Meets expectations','Often exceeds expectations',"It's my strength"]
  },
  {
    key:'q6', label:'Racquet background', type:'choice', section:'On-court history',
    text:'Do or did you play squash or tennis on a consistent basis?',
    options:['Recreationally or never','Yes, less than two years','Yes, 3–6 years','Yes, more than five years','Yes, competitively or collegiate level']
  },
  {
    key:'q7', label:'Tournaments', type:'choice', section:'On-court history',
    text:'Have you battled it out in padel tournaments?',
    options:['Matches? Haven\u2019t thought that far yet','Casual games with buddies','Social tournaments','Club-level competition','I\u2019ve played USPA tournaments or at the national level of my home country']
  },
];

let current = 0;
const answers = {};
let player = {name:'', email:'', phone:''};

const introView = document.getElementById('introView');
const quizView = document.getElementById('quizView');
const resultView = document.getElementById('resultView');
const courtBar = document.getElementById('courtBar');
const progressLabelRow = document.getElementById('progressLabelRow');
const questionText = document.getElementById('questionText');
const sectionLabel = document.getElementById('sectionLabel');
const answerArea = document.getElementById('answerArea');
const nextBtn = document.getElementById('nextBtn');
const backBtn = document.getElementById('backBtn');
const courtFill = document.getElementById('courtFill');
const progressText = document.getElementById('progressText');

document.getElementById('startBtn').addEventListener('click', () => {
  const name = document.getElementById('playerName').value.trim();
  const email = document.getElementById('playerEmail').value.trim();
  const phone = document.getElementById('playerPhone').value.trim();
  const errorEl = document.getElementById('introError');

  if(!name || !email || !phone){
    errorEl.textContent = 'Please fill in your name, email, and phone to continue.';
    return;
  }
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailPattern.test(email)){
    errorEl.textContent = 'Please enter a valid email address.';
    return;
  }
  errorEl.textContent = '';
  player = {name, email, phone};

  introView.style.display = 'none';
  courtBar.style.display = 'block';
  progressLabelRow.style.display = 'flex';
  quizView.style.display = 'block';
  render();
});

function render(){
  const q = questions[current];
  sectionLabel.textContent = q.section;
  questionText.textContent = q.text;
  progressText.textContent = `Question ${current+1} of ${questions.length}`;
  courtFill.style.width = ((current)/(questions.length-1))*100 + '%';
  backBtn.disabled = current === 0;
  backBtn.style.opacity = current === 0 ? '0' : '1';

  answerArea.innerHTML = '';

  if(q.type === 'choice'){
    const box = document.createElement('div');
    box.className = 'options';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt;
      btn.type = 'button';
      if(answers[q.key] !== undefined && answers[q.key].index === i) btn.classList.add('selected');
      btn.addEventListener('click', () => {
        answers[q.key] = {index:i, label:opt};
        [...box.children].forEach(c=>c.classList.remove('selected'));
        btn.classList.add('selected');
        nextBtn.disabled = false;
      });
      box.appendChild(btn);
    });
    answerArea.appendChild(box);
    nextBtn.disabled = answers[q.key] === undefined;
  }

  if(q.type === 'slider'){
    const wrap = document.createElement('div');
    wrap.className = 'slider-wrap';
    const startVal = answers[q.key] !== undefined ? answers[q.key].raw : 4;
    wrap.innerHTML = `
      <div class="slider-value" id="sliderVal">${startVal}</div>
      <div class="slider-caption" id="sliderCaption">${q.captions[startVal-1] || ''}</div>
      <input type="range" min="1" max="7" step="1" value="${startVal}" id="sliderInput">
      <div class="scale-ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
    `;
    answerArea.appendChild(wrap);
    const input = document.getElementById('sliderInput');
    const valEl = document.getElementById('sliderVal');
    const capEl = document.getElementById('sliderCaption');
    input.addEventListener('input', () => {
      const v = parseInt(input.value,10);
      valEl.textContent = v;
      capEl.textContent = q.captions[v-1] || '';
      answers[q.key] = {raw:v};
      nextBtn.disabled = false;
    });
    answers[q.key] = {raw:startVal};
    nextBtn.disabled = false;
  }

  nextBtn.textContent = current === questions.length - 1 ? 'See my rating' : 'Next';
}

nextBtn.addEventListener('click', () => {
  if(current < questions.length - 1){
    current++;
    render();
  } else {
    showResult();
  }
});

backBtn.addEventListener('click', () => {
  if(current > 0){
    current--;
    render();
  }
});

function computeNPRP(){
  const q1 = answers.q1.index + 1;
  const q4 = answers.q4.index + 1;
  const q5 = answers.q5.index + 1;
  const q6 = answers.q6.index + 1;
  const q7 = answers.q7.index + 1;

  const groupAvg = (q1+q4+q5+q6+q7)/5;

  let genderMod = 0, ageMod = 0;
  if(answers.q2.label === 'Female') genderMod = -0.5;
  if(answers.q3.label === '40–50') ageMod = -0.25;
  if(answers.q3.label === '+50') ageMod = -0.5;

  let raw = groupAvg + genderMod + ageMod;
  raw = Math.max(1.0, Math.min(5.0, raw));

  // Normalize the 1–5 NPRP score onto a 1–6 display scale: 1 stays 1, 5 becomes 6
  let normalized = 1 + (raw - 1) * (5 / 4);
  normalized = Math.max(1.0, Math.min(6.0, normalized));

  return {
    score: normalized,
    rows: [
      {label:'Level (Q1)', value: answers.q1.label, points: q1},
      {label:'Match frequency (Q4)', value: answers.q4.label, points: q4},
      {label:'Bandeja (Q5)', value: answers.q5.label, points: q5},
      {label:'Tennis/squash (Q6)', value: answers.q6.label, points: q6},
      {label:'Tournaments (Q7)', value: answers.q7.label, points: q7},
      {label:'Gender modifier', value: answers.q2.label, points: genderMod, modifier:true},
      {label:'Age modifier', value: answers.q3.label, points: ageMod, modifier:true},
    ]
  };
}

function tierLabel(score){
  if(score < 2.0) return 'First Timer';
  if(score < 3.0) return 'Beginner';
  if(score < 4.0) return 'Intermediate';
  if(score < 5.0) return 'Advanced';
  return 'Competition';
}

function showResult(){
  const result = computeNPRP();
  quizView.style.display = 'none';
  resultView.style.display = 'block';
  courtFill.style.width = '100%';
  progressText.textContent = 'Complete';

  document.getElementById('resultNumber').textContent = result.score.toFixed(2);
  document.getElementById('resultTier').textContent = tierLabel(result.score);

  saveSubmission(result);
}

// Paste the Web App URL from your Apps Script deployment here,
// e.g. https://script.google.com/macros/s/AKfycb.../exec
const APPS_SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";

function saveSubmission(result){
  const statusEl = document.getElementById('saveStatus');

  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    statusEl.textContent = 'Backend not connected yet — score not saved.';
    statusEl.className = 'save-status error';
    return;
  }

  statusEl.textContent = 'Saving your rating...';
  statusEl.className = 'save-status';

  const nameParts = player.name.trim().split(/\s+/);
  const firstName = nameParts[0] || '';
  const lastName = nameParts.slice(1).join(' ') || '';

  const form = document.getElementById('nprpSubmitForm');
  form.action = APPS_SCRIPT_URL;
  form.firstName.value = firstName;
  form.lastName.value = lastName;
  form.email.value = player.email;
  form.phone.value = player.phone;
  form.score.value = result.score.toFixed(2);
  form.tier.value = tierLabel(result.score);
  form.q1.value = answers.q1.label;
  form.q2.value = answers.q2.label;
  form.q3.value = answers.q3.label;
  form.q4.value = answers.q4.label;
  form.q5.value = answers.q5.label;
  form.q6.value = answers.q6.label;
  form.q7.value = answers.q7.label;

  // Submitting into a hidden iframe (rather than fetch) avoids CORS
  // issues with the Apps Script Web App, same approach as the booking form.
  const iframe = document.getElementById('nprpSubmitFrame');
  let settled = false;
  iframe.onload = () => {
    if(settled) return;
    settled = true;
    statusEl.textContent = 'Saved to Arenna records.';
  };
  form.submit();

  // Fallback in case the iframe load event doesn't fire reliably.
  setTimeout(() => {
    if(!settled){
      settled = true;
      statusEl.textContent = 'Saved to Arenna records.';
    }
  }, 2500);
}
</script>
